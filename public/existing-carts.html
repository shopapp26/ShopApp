<!DOCTYPE html>
<html>

<head>

            color: #333;
        }

            margin: auto;
        }

        .cart-card {

            background: white;

            border-radius: 15px;

            padding: 20px;

            margin-bottom: 15px;

            box-shadow:
                0 5px 15px rgba(
                    0,

                    0,
                    0.1
                );
        }

        .cart-card p {

            margin-bottom: 10px;

            font-size: 16px;
        }

            width: 100%;

            border: none;

            border-radius: 10px;

<body>

    <h1>📋 Existing Carts</h1>

    <div id="list"></div>

    <script>
       const list = document.getElementById("list");

let carts = [];

loadCarts();

async function loadCarts() {

    const smcode = sessionStorage.getItem("smcode");
    console.log("SMCODE =", smcode);
    const response = await fetch("/api/existing-carts/" + smcode);

    carts = await response.json();

    if (carts.length === 0) {

        list.innerHTML =
            '<h3 class="empty">No carts found</h3>';

        return;
    }

    list.innerHTML = carts.map((cart, index) => `

        <div class="cart-card">

            <div style="
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
">

    <p style="margin:0;">
        <b>Customer:</b>
        ${cart.cname}
    </p>

    <button
        onclick="deleteCart(${index})"
        style="
            width:auto;
            margin:0;
            padding:2px 6px;
            background:transparent;
            border:none;
            font-size:24px;
            cursor:pointer;
        "
        title="Delete Cart"
    >
        <svg width="22" height="22" viewBox="0 0 24 24"
     fill="none"
     stroke="#333"
     stroke-width="2"
     stroke-linecap="round"
     stroke-linejoin="round">
    <path d="M3 6h18"/>
    <path d="M8 6V4h8v2"/>
    <path d="M19 6l-1 15H6L5 6"/>
    <path d="M10 11v6"/>
    <path d="M14 11v6"/>
</svg>
    </button>

</div>

            <p>
                <b>Phone:</b>
                ${cart.mobileno}
            </p>

            <button onclick="editCart(${index})">

                ✏️ Edit Cart

            </button>

        </div>

    `).join("");

}

async function editCart(index) {

    const cart = carts[index];

    const response = await fetch(
        "/api/cart/" + cart.mobileno
    );

    const items = await response.json();

    const newCart = [];

    for (const item of items) {
        console.log("ITEM FROM DATABASE =", item);
        newCart.push({

    id: item.ucode,

    name:
        item.product + " / " +
        item.category + " / " +
        item.item + " / " +
        item.colour + " / " +
        item.itmsize + " / " +
        item.qlty + " / " +
        item.pack,

    price: item.rate,

    qty: item.qty,

    group: item.tmpgrp,
    unit: item.unit,

});

    }
     
    localStorage.setItem(
        "cart",
        JSON.stringify(newCart)
    );

    localStorage.setItem(
        "customerName",
        cart.cname
    );

    localStorage.setItem(
    "customerPhone",
    cart.mobileno
);

// Tell cart.html that this is an existing cart being edited
localStorage.setItem(
    "editingCart",
    "true"
);

window.location.href = "/cart.html";

}
async function deleteCart(index) {

    const cart = carts[index];

    const ok = await customConfirm(
        "Delete this cart?\n\n" +
        "Customer: " + cart.cname +
        "\nPhone: " + cart.mobileno
    );

    if (!ok) {
        return;
    }

    const response = await fetch(
        "/api/delete-cart",
        {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                smcode: sessionStorage.getItem("smcode"),

                mobile: cart.mobileno

            })
        }
    );

    const result = await response.json();

    if (result.success) {

        alert("Cart deleted successfully.");

        loadCarts();

    } else {

        alert("Unable to delete cart.");

    }

}
    </script>
<style>
#appDialogOverlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
    z-index: 99999;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

#appDialog {
    width: 100%;
    max-width: 380px;
    background: white;
    border-radius: 16px;
    padding: 22px;
    box-shadow: 0 15px 45px rgba(0, 0, 0, 0.25);
    font-family: Arial, sans-serif;
}

#appDialogTitle {
    margin: 0 0 10px;
    font-size: 20px;
    color: #111827;
}

#appDialogMessage {
    margin: 0 0 20px;
    color: #4b5563;
    font-size: 16px;
    line-height: 1.5;
    white-space: pre-line;
}

#appDialogButtons {
    display: flex;
    gap: 10px;
}

#appDialogButtons button {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 9px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

#appDialogNo {
    background: #e5e7eb;
    color: #111827;
}

#appDialogYes {
    background: #4f46e5;
    color: white;
}

#appDialogYes.danger {
    background: #ef4444;
}
</style>

<div id="appDialogOverlay">

    <div id="appDialog">

        <h3 id="appDialogTitle">
            Message
        </h3>

        <p id="appDialogMessage"></p>

        <div id="appDialogButtons">

            <button
                id="appDialogNo"
                type="button"
            >
                No
            </button>

            <button
                id="appDialogYes"
                type="button"
            >
                OK
            </button>

        </div>

    </div>

</div>

<script>

function showAppDialog(message, confirmMode = false) {

    return new Promise(resolve => {

        const overlay =
            document.getElementById("appDialogOverlay");

        const msg =
            document.getElementById("appDialogMessage");

        const yes =
            document.getElementById("appDialogYes");

        const no =
            document.getElementById("appDialogNo");

        msg.textContent = message;

        overlay.style.display = "flex";

        yes.textContent =
            confirmMode ? "Yes" : "OK";

        no.style.display =
            confirmMode ? "block" : "none";

        yes.classList.toggle(
            "danger",
            confirmMode
        );

        function finish(value) {

            overlay.style.display = "none";

            yes.onclick = null;
            no.onclick = null;
            overlay.onclick = null;

            resolve(value);
        }

        yes.onclick = () => finish(true);

        no.onclick = () => finish(false);

        overlay.onclick = e => {

            if (
                e.target === overlay &&
                confirmMode
            ) {
                finish(false);
            }

        };

    });

}

function customAlert(message) {

    return showAppDialog(
        message,
        false
    );

}

function customConfirm(message) {

    return showAppDialog(
        message,
        true
    );

}

</script>
<script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
        navigator.serviceWorker.register("/service-worker.js")
            .then(function () {
                console.log("ShopApp service worker registered");
            })
            .catch(function (error) {
                console.error("Service worker registration failed:", error);
            });
    });
}
</script>
